name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev ccache lld openjdk-17-jdk zip unzip autoconf libtool pkg-config patch

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer kivy

    - name: Build APK with Buildozer
      run: |
        buildozer init
        sed -i 's/title = My Application/title = Control Taxi/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = controltaxi/' buildozer.spec
        sed -i 's/#icon.filename = %(source.dir)s\/data\/icon.png/icon.filename = icon.png/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
        sed -i 's/# android.api = 31/android.api = 33/' buildozer.spec
        sed -i 's/# android.minapi = 21/android.minapi = 24/' buildozer.spec
        sed -i 's/# android.ndk = 25b/android.ndk = 25b/' buildozer.spec
        sed -i 's/# p4a.branch = master/p4a.branch = master/' buildozer.spec
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ControlTaxi-APK
        path: bin/*.apk
